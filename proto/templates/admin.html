<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>석담교회 말씀 이음 — 관리자</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap');

  :root {
    /* Color Palette - Professional yet warm */
    --bg-main:      #F4F1ED;
    --bg-card:      #FFFFFF;
    --bg-header:    #FFFFFF;
    
    --border:       #E2DCD3;
    --border-focus: #8B2635;

    --text-main:    #2C241B;
    --text-sub:     #6B6054;
    --text-muted:   #9E948A;

    --primary:      #8B2635;
    --primary-hover:#A33041;
    --secondary:    #B8963E;
    
    --success:      #2E7D32;
    --success-bg:   #E8F5E9;
    --error:        #C62828;
    --error-bg:     #FFEBEE;
    --warning:      #F57C00;
    
    --shadow-sm:    0 2px 4px rgba(44, 36, 27, 0.04);
    --shadow-md:    0 4px 12px rgba(44, 36, 27, 0.08);
    
    --radius-md:    12px;
    --radius-lg:    16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── 1. 헤더 (Header) ── */
  .header {
    background: var(--bg-header);
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow-sm);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: -0.02em;
  }

  .admin-badge {
    font-size: 13px;
    background: var(--text-main);
    color: #fff;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .viewer-link-btn, .qr-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card);
    color: var(--text-main);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
  }
  .viewer-link-btn:hover, .qr-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: #FFF9FA;
  }

  /* QR 모달 */
  .qr-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }
  .qr-overlay.active { display: flex; }

  .qr-modal {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 36px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    animation: modalIn 0.25s ease-out;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .qr-modal h2 {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px;
    color: var(--primary);
    margin-bottom: 8px;
  }
  .qr-modal .qr-subtitle {
    font-size: 14px;
    color: var(--text-sub);
    margin-bottom: 24px;
  }
  .qr-modal canvas, .qr-modal svg {
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .qr-url {
    margin-top: 16px;
    padding: 10px 16px;
    background: var(--bg-main);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    word-break: break-all;
    user-select: all;
  }
  .qr-note {
    margin-top: 12px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .qr-close-btn {
    margin-top: 20px;
    padding: 10px 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-card);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-main);
  }
  .qr-close-btn:hover {
    background: var(--bg-main);
  }

  /* ── 2. 메인 레이아웃 (Dashboard Grid) ── */
  .dashboard {
    flex: 1;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 24px;
    padding: 24px 32px;
    max-width: 1600px;
    margin: 0 auto;
    width: 100%;
    height: calc(100vh - 72px - 40px);
  }

  .card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .card-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: #FAFAFA;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-body {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow-y: auto;
  }

  /* ── 3. 좌측: 제어 패널 (Control Panel) ── */
  .control-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .control-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-sub);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  select {
    width: 100%;
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    outline: none;
    transition: all 0.2s;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6054' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 16px center;
    background-size: 16px;
  }
  select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139, 38, 53, 0.1); }
  select:disabled { background: #F5F5F5; color: var(--text-muted); cursor: not-allowed; }

  .chip-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .lang-chip {
    display: block;
    position: relative;
    cursor: pointer;
  }

  .lang-chip input {
    position: absolute;
    opacity: 0;
    cursor: pointer;
  }

  .chip-content {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 12px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-sub);
    background: var(--bg-card);
    transition: all 0.2s;
    user-select: none;
  }

  .lang-chip input:checked ~ .chip-content {
    border-color: var(--primary);
    background: #FFF9FA;
    color: var(--primary);
  }
  .lang-chip input:disabled ~ .chip-content {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .toggle-switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #FAFAFA;
  }
  
  .toggle-switch-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
  }

  .switch {
    position: relative;
    display: inline-block;
    width: 52px;
    height: 28px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #CCC;
    transition: .3s;
    border-radius: 34px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 4px;
    bottom: 4px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--success); }
  input:checked + .slider:before { transform: translateX(24px); }
  input:disabled + .slider { opacity: 0.5; cursor: not-allowed; }

  .action-buttons {
    margin-top: auto;
    display: flex;
    gap: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .btn-action {
    flex: 1;
    padding: 18px 0;
    border: none;
    border-radius: var(--radius-md);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-start {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 12px rgba(139, 38, 53, 0.3);
  }
  .btn-start:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-2px); }
  
  .btn-stop {
    background: var(--bg-main);
    color: var(--text-main);
    border: 1px solid var(--border);
  }
  .btn-stop:hover:not(:disabled) { background: #EBEBEB; }
  
  .btn-action:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  /* ── 4. 우측: 통계 및 모니터 (Stats & Monitor) ── */
  .right-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
    height: 100%;
    overflow: hidden;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
  }

  .stat-box {
    background: var(--bg-card);
    padding: 16px 18px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .stat-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .stat-value small { font-size: 14px; color: var(--text-muted); font-weight: 500; }

  .text-primary { color: var(--primary); }
  .text-success { color: var(--success); }

  /* 원본 상태 점 스타일 통합 */
  .status-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-right: 6px;
  }
  .dot-ready      { background: var(--text-muted); }
  .dot-connecting { background: var(--warning); animation: pulse 1s infinite; }
  .dot-running    { background: var(--success); animation: pulse 1.5s infinite; }
  .dot-error      { background: var(--error); }
  .dot-stopped    { background: var(--text-muted); }

  .live-indicator {
    display: flex;
    align-items: center;
    font-size: 15px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  .monitor-card {
    flex: 1;
  }

  .monitor-body {
    background: var(--bg-card);
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .segment {
    background: var(--bg-main);
    border-radius: 12px;
    padding: 20px;
    border-left: 5px solid var(--secondary);
    animation: slideUp 0.3s ease-out;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .seg-ko {
    font-family: 'Noto Serif KR', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .seg-translation-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
  }

  .seg-translation {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.4;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .seg-translation.pending { color: var(--text-muted); font-style: italic; }

  .refined-badge { font-size: 14px; color: var(--secondary); cursor: help; margin-right: 4px; }

  .seg-meta {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 12px;
    text-align: right;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .empty-state .icon {
    font-size: 48px;
    color: var(--border);
  }
  .empty-state p {
    font-size: 18px;
    font-weight: 500;
  }

  /* ── 5. 하단 상태바 (Status Bar) ── */
  .status-bar {
    background: var(--bg-header);
    border-top: 1px solid var(--border);
    padding: 10px 32px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sub);
  }

  @media (max-width: 1200px) {
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 1024px) {
    .dashboard { grid-template-columns: 1fr; height: auto; overflow-y: auto; }
    .monitor-card { min-height: 500px; }
  }
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <div class="header-left">
    <h1><span style="color: var(--secondary);">✝</span> 석담교회 말씀 이음</h1>
    <span class="admin-badge">관리자 시스템</span>
  </div>
  <div class="header-right">
    <button class="qr-btn" onclick="showQRCode()" title="성도용 QR 코드를 표시합니다">
      QR 접속 코드
    </button>
    <a class="viewer-link-btn" href="/" target="_blank" title="성도들이 보는 화면을 새 창으로 엽니다">
      📺 성도용 화면 보기
    </a>
  </div>
</div>

<!-- QR 코드 모달 -->
<div class="qr-overlay" id="qrOverlay" onclick="closeQRModal(event)">
  <div class="qr-modal" onclick="event.stopPropagation()">
    <h2>성도용 화면 접속</h2>
    <p class="qr-subtitle">아래 QR 코드를 스마트폰으로 스캔하세요</p>
    <div id="qrCanvas"></div>
    <div class="qr-url" id="qrUrl">로딩 중...</div>
    <p class="qr-note">같은 네트워크(Wi-Fi)에 연결되어 있어야 접속할 수 있습니다</p>
    <button class="qr-close-btn" onclick="closeQRModal()">닫기</button>
  </div>
</div>

<!-- 메인 대시보드 -->
<div class="dashboard">

  <!-- 좌측: 제어 패널 -->
  <div class="card">
    <div class="card-header">방송 제어부</div>
    <div class="card-body">
      
      <!-- 마이크 선택 -->
      <div class="control-section">
        <label class="control-label">🎤 입력 마이크 선택</label>
        <select id="micSelect"><option value="-1">로딩 중...</option></select>
      </div>

      <!-- 모델 선택 -->
      <div class="control-section">
        <label class="control-label">⚙️ 인식 모델</label>
        <select id="modelSelect"></select>
      </div>

      <!-- 번역 언어 선택 (칩 스타일) -->
      <div class="control-section">
        <label class="control-label">🌐 번역할 언어 (다중 선택 가능)</label>
        <div class="chip-group" id="langCheckboxes"></div>
      </div>

      <!-- 음성 송출 토글 -->
      <div class="control-section" style="margin-top: 8px;">
        <label class="toggle-switch">
          <span class="toggle-switch-text">🔊 성도용 화면으로 음성 송출</span>
          <div class="switch">
            <input type="checkbox" id="audioStreamToggle" checked onchange="toggleAudioStreaming()">
            <span class="slider"></span>
          </div>
        </label>
      </div>

      <!-- 대형 시작/중지 버튼 -->
      <div class="action-buttons">
        <button class="btn-action btn-start" id="btnStart" onclick="startSession()">▶ 방송 시작</button>
        <button class="btn-action btn-stop" id="btnStop" onclick="stopSession()" disabled>■ 정지</button>
      </div>

    </div>
  </div>

  <!-- 우측: 모니터 및 통계 -->
  <div class="right-panel">
    
    <!-- 통계 위젯 -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-title">STT 상태</div>
        <div class="stat-value">
          <div class="live-indicator">
            <span class="status-dot dot-ready" id="statusDot"></span>
            <span id="statusMsg">대기 중</span>
          </div>
        </div>
      </div>
      
      <div class="stat-box">
        <div class="stat-title">음성 송출</div>
        <div class="stat-value">
          <div class="live-indicator">
            <span class="status-dot dot-ready" id="audioDot"></span>
            <span id="audioStatusMsg">대기 중</span>
          </div>
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-title">접속 중인 성도</div>
        <div class="stat-value text-primary">
          <span id="viewerCount">0</span><small>명</small>
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-title">음성 인식률(신뢰도)</div>
        <div class="stat-value text-success">
          <span id="statConfidence">—</span>
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-title">번역 평균 지연시간</div>
        <div class="stat-value">
          <span id="avgLatency">—</span><small>ms</small>
        </div>
      </div>
    </div>

    <!-- 자막 모니터 -->
    <div class="card monitor-card">
      <div class="card-header">
        실시간 자막 모니터
        <span style="font-size: 13px; font-weight: normal; color: var(--text-muted);">가장 최근 말씀이 아래에 표시됩니다.</span>
      </div>
      <div class="card-body monitor-body" id="subtitleArea">
        <div class="empty-state" id="emptyState">
          <div class="icon">💬</div>
          <p>좌측의 <b>[방송 시작]</b> 버튼을 누르면 자막이 표시됩니다.</p>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- 하단 상태바 -->
<div class="status-bar">
  <span id="connStatus">● WebSocket 연결 중...</span>
  <span id="statLatency"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// ── QR 모달 ──
let cachedViewerUrl = null;

async function showQRCode() {
  const overlay = document.getElementById('qrOverlay');
  overlay.classList.add('active');

  if (!cachedViewerUrl) {
    try {
      const res = await fetch('/api/network-info');
      const info = await res.json();
      cachedViewerUrl = info.viewer_url;
    } catch (e) {
      cachedViewerUrl = `${location.protocol}//${location.host}/`;
    }
  }

  document.getElementById('qrUrl').textContent = cachedViewerUrl;

  const container = document.getElementById('qrCanvas');
  container.innerHTML = '';

  try {
    const qr = qrcode(0, 'M');
    qr.addData(cachedViewerUrl);
    qr.make();
    container.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 4, scalable: true });
    // SVG 크기 고정
    const svg = container.querySelector('svg');
    if (svg) {
      svg.setAttribute('width', '280');
      svg.setAttribute('height', '280');
      svg.style.borderRadius = '12px';
      svg.style.border = '1px solid #E2DCD3';
    }
  } catch (e) {
    container.textContent = 'QR 코드 생성 실패: ' + e.message;
  }
}

function closeQRModal(event) {
  if (event && event.target !== document.getElementById('qrOverlay')) return;
  document.getElementById('qrOverlay').classList.remove('active');
}

// ── 설정 (서버에서 fetch) ──
let MAX_SEGMENTS = 5;
let LANGUAGES = {};
let MODELS = [];
let DEFAULT_MODEL = '';

// ── 상태 ──
let ws = null;
let segments = [];
let selectedLanguages = [];
let isRunning = false;
let latencyHistory = [];

// ── 초기화 ──
window.addEventListener('load', async () => {
  await loadConfig();
  initLanguageCheckboxes();
  initModelSelect();
  connectWebSocket();
});

async function loadConfig() {
  try {
    const res = await fetch('/api/config');
    const cfg = await res.json();
    LANGUAGES = cfg.languages;
    MODELS = cfg.models;
    DEFAULT_MODEL = cfg.default_model;
    MAX_SEGMENTS = cfg.max_segments;
  } catch (e) {
    console.error('설정 로드 실패:', e);
  }
}

function initLanguageCheckboxes() {
  const container = document.getElementById('langCheckboxes');
  container.innerHTML = '';
  for (const [code, cfg] of Object.entries(LANGUAGES)) {
    const label = document.createElement('label');
    label.className = 'lang-chip';
    // 새 디자인인 칩 구조로 적용하되 기존 value는 그대로
    label.innerHTML = `
      <input type="checkbox" value="${code}" checked>
      <span class="chip-content">${cfg.flag} ${cfg.name}</span>
    `;
    container.appendChild(label);
  }
}

function initModelSelect() {
  const sel = document.getElementById('modelSelect');
  sel.innerHTML = '';
  MODELS.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    if (m === DEFAULT_MODEL) opt.selected = true;
    sel.appendChild(opt);
  });
}

function getSelectedLanguages() {
  const checks = document.querySelectorAll('#langCheckboxes input:checked');
  return Array.from(checks).map(c => c.value);
}

// ── WebSocket (원본 연결 로직) ──
function connectWebSocket() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/admin`);

  ws.onopen = () => {
    document.getElementById('connStatus').textContent = '● 연결됨';
    ws.send(JSON.stringify({ action: 'get_mics' }));
  };

  ws.onmessage = (evt) => {
    const data = JSON.parse(evt.data);
    handleMessage(data);
  };

  ws.onclose = () => {
    document.getElementById('connStatus').textContent = '● 연결 끊김 — 재연결 중...';
    updateStatus('error', '연결 끊김');
    if (isRunning) {
      isRunning = false;
      updateButtons();
    }
    setTimeout(connectWebSocket, 3000);
  };

  ws.onerror = () => {
    updateStatus('error', '연결 오류');
  };
}

function handleMessage(data) {
  switch (data.type) {
    case 'mics':
      populateMics(data.devices);
      break;
    case 'status':
      updateStatus(data.state, data.message);
      break;
    case 'stt':
      addSegment(data.segment_id, data.text, data.confidence);
      break;
    case 'translation':
      addTranslation(data.segment_id, data.lang, data.text, data.latency_ms, data.error, data.refined_ko);
      break;
    case 'error':
      updateStatus('error', data.message);
      break;
    case 'viewer_count':
      document.getElementById('viewerCount').textContent = data.count;
      break;
    case 'audio_status':
      updateAudioStatus(data.enabled);
      break;
  }
}

function populateMics(devices) {
  const sel = document.getElementById('micSelect');
  sel.innerHTML = '';
  devices.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.index;
    opt.textContent = d.name + (d.is_default ? ' (기본)' : '');
    if (d.is_default) opt.selected = true;
    sel.appendChild(opt);
  });
}

// ── 세션 제어 ──
function startSession() {
  selectedLanguages = getSelectedLanguages();
  if (selectedLanguages.length === 0) {
    alert('번역할 언어를 하나 이상 선택하세요.');
    return;
  }

  segments = [];
  latencyHistory = [];
  renderSubtitles();

  const msg = {
    action: 'start',
    mic_index: parseInt(document.getElementById('micSelect').value),
    languages: selectedLanguages,
    model: document.getElementById('modelSelect').value,
  };
  ws.send(JSON.stringify(msg));

  isRunning = true;
  updateButtons();
  // 음성 스트리밍 상태 반영
  updateAudioStatus(document.getElementById('audioStreamToggle').checked);
}

function stopSession() {
  ws.send(JSON.stringify({ action: 'stop' }));
  isRunning = false;
  updateButtons();
  updateAudioStatus(false);
}

function updateButtons() {
  document.getElementById('btnStart').disabled = isRunning;
  document.getElementById('btnStop').disabled = !isRunning;
  document.getElementById('micSelect').disabled = isRunning;
  document.getElementById('modelSelect').disabled = isRunning;
  document.querySelectorAll('#langCheckboxes input').forEach(c => c.disabled = isRunning);
}

// ── 자막 표시 ──
function addSegment(segmentId, koreanText, confidence) {
  segments.push({
    id: segmentId,
    ko: koreanText,
    ko_raw: koreanText,
    ko_refined: false,
    confidence: confidence,
    translations: {},
  });
  if (segments.length > MAX_SEGMENTS) segments.shift();

  const conf = confidence ? confidence.toFixed(3) : '—';
  document.getElementById('statConfidence').textContent = conf;
  renderSubtitles();
}

function addTranslation(segmentId, lang, text, latencyMs, error, refinedKo) {
  const seg = segments.find(s => s.id === segmentId);
  if (seg) {
    seg.translations[lang] = { text, latency: latencyMs, error };

    if (refinedKo && refinedKo.trim() && !seg.ko_refined) {
      seg.ko = refinedKo;
      seg.ko_refined = true;
    }

    // 누적 평균 지연 계산
    if (latencyMs) {
      latencyHistory.push(latencyMs);
      if (latencyHistory.length > 20) latencyHistory.shift();
      const avg = latencyHistory.reduce((a, b) => a + b, 0) / latencyHistory.length;
      document.getElementById('avgLatency').textContent = Math.round(avg);
    }

    document.getElementById('statLatency').textContent =
      `최근 번역: ${Math.round(latencyMs)}ms`;
    renderSubtitles();
  }
}

function renderSubtitles() {
  const area = document.getElementById('subtitleArea');
  const empty = document.getElementById('emptyState');

  if (segments.length === 0) {
    empty.style.display = 'flex';
    area.querySelectorAll('.segment').forEach(el => el.remove());
    return;
  }
  empty.style.display = 'none';

  area.querySelectorAll('.segment').forEach(el => el.remove());

  segments.forEach(seg => {
    const div = document.createElement('div');
    div.className = 'segment';

    // 원본의 수정된 자막(refined) 표시 로직 유지 (CSS는 새 버전에 맞춰 최적화)
    const koLabel = seg.ko_refined
      ? `<span class="refined-badge" title="원본: ${escapeAttr(seg.ko_raw)}">✎</span> `
      : '';
    let html = `<div class="seg-ko">${koLabel}${escapeHtml(seg.ko)}</div>`;
    
    html += `<div class="seg-translation-list">`;
    selectedLanguages.forEach(lang => {
      const tr = seg.translations[lang];
      const cfg = LANGUAGES[lang];
      if (!cfg) return;
      
      if (tr) {
        const cls = tr.error ? 'pending' : lang;
        html += `<div class="seg-translation ${cls}"><span>${cfg.flag}</span> <span>${escapeHtml(tr.text)}</span></div>`;
      } else {
        html += `<div class="seg-translation pending"><span>${cfg.flag}</span> <span>번역 중...</span></div>`;
      }
    });
    html += `</div>`;

    // 메타데이터 표시 (원본 로직 유지)
    const latencies = Object.values(seg.translations)
      .filter(t => t.latency)
      .map(t => `${Math.round(t.latency)}ms`);
    const metaText = `신뢰도 ${seg.confidence ? seg.confidence.toFixed(3) : '—'}` +
      (latencies.length ? ` · 번역 ${latencies.join(' / ')}` : '');
    html += `<div class="seg-meta">${metaText}</div>`;

    div.innerHTML = html;
    area.appendChild(div);
  });

  area.scrollTop = area.scrollHeight;
}

// ── 상태 업데이트 ──
function updateStatus(state, message) {
  const dot = document.getElementById('statusDot');
  const msg = document.getElementById('statusMsg');
  if(dot) dot.className = `status-dot dot-${state}`;
  if(msg) msg.textContent = message;
}

// ── 음성 스트리밍 토글 ──
function toggleAudioStreaming() {
  const enabled = document.getElementById('audioStreamToggle').checked;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ action: 'toggle_audio', enabled }));
  }
}

function updateAudioStatus(enabled) {
  const dot = document.getElementById('audioDot');
  const msg = document.getElementById('audioStatusMsg');
  if(dot) dot.className = `status-dot ${enabled ? 'dot-running' : 'dot-stopped'}`;
  if(msg) msg.textContent = enabled ? '송출 중' : '꺼짐';
  document.getElementById('audioStreamToggle').checked = enabled;
}

// ── 유틸 ──
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function escapeAttr(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
